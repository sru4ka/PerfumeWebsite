<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Perfumedia</title>
  <!-- One link for both stores (owner, 23 Oct): an iPhone goes straight to the
       App Store, an Android phone straight to Google Play, before anything is
       drawn. Anyone else (a computer) sees both stores and a QR code. -->
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var apple = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      if (/android/i.test(ua)) location.replace("https://play.google.com/store/apps/details?id=com.dbromberg.scented");
      else if (apple) location.replace("https://apps.apple.com/us/app/perfumedia-perfume-tracker/id6792554738");
    })();
  </script>
  <meta name="description" content="Download Perfumedia on the App Store or Google Play." />
  <meta name="theme-color" content="#FAF7F2" />
  <meta property="og:title" content="Get Perfumedia" />
  <meta property="og:description" content="Your fragrance wardrobe, in your pocket. On the App Store and Google Play." />
  <meta property="og:url" content="https://perfumediapp.com/get" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #FAF7F2; --card: #fffdf8; --text: #1c1b1f; --text-2: #6b6872; --accent: #b08a1e; --hairline: #ece6da; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px;
      background: radial-gradient(circle at 20% 10%, rgba(201,162,39,0.14), transparent 45%), var(--bg);
      color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; }
    .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--hairline); border-radius: 26px;
      padding: 36px 28px 28px; text-align: center; box-shadow: 0 30px 60px -30px rgba(28,27,31,0.35); }
    .logo { width: 44px; height: 44px; }
    h1 { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.15; margin: 14px 0 8px; }
    h1 em { color: var(--accent); }
    p { color: var(--text-2); margin: 0 0 24px; font-size: 15.5px; line-height: 1.5; }
    .stores { display: flex; flex-direction: column; gap: 12px; }
    .store { display: flex; align-items: center; justify-content: center; gap: 12px; background: var(--text); color: #fff;
      text-decoration: none; padding: 13px 20px; border-radius: 14px; transition: transform .2s ease; }
    .store:hover, .store:focus-visible { transform: translateY(-2px); }
    .store span { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; font-weight: 600; font-size: 18px; }
    .store small { font-size: 10.5px; font-weight: 500; opacity: .8; letter-spacing: .02em; }
    .qr { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--hairline); }
    .qr img { width: 150px; height: 150px; border-radius: 12px; border: 1px solid var(--hairline); padding: 6px; background: #fff; }
    .qr div { font-size: 13px; color: var(--text-2); margin-top: 8px; }
    .home { display: inline-block; margin-top: 20px; font-size: 13.5px; color: var(--text-2); }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/logo/mark.png" alt="Perfumedia" />
    <h1>Get <em>Perfumedia</em></h1>
    <p>Your fragrance wardrobe, in your pocket. Choose your phone's store.</p>
    <div class="stores">
      <a class="store" href="https://apps.apple.com/us/app/perfumedia-perfume-tracker/id6792554738" rel="noopener">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M17.05 12.54c-.02-2.02 1.65-2.99 1.72-3.04-.94-1.37-2.4-1.56-2.92-1.58-1.24-.13-2.42.73-3.05.73-.63 0-1.6-.71-2.63-.69-1.35.02-2.6.79-3.29 2-1.4 2.43-.36 6.03 1 8 .67.96 1.46 2.04 2.5 2 1-.04 1.38-.65 2.59-.65 1.21 0 1.55.65 2.61.63 1.08-.02 1.76-.98 2.42-1.95.76-1.11 1.07-2.19 1.09-2.24-.02-.01-2.09-.8-2.11-3.18ZM15.1 6.28c.55-.67.93-1.6.82-2.53-.8.03-1.77.53-2.34 1.2-.51.59-.96 1.54-.84 2.44.9.07 1.81-.45 2.36-1.11Z"/></svg>
        <span><small>Download on the</small>App Store</span>
      </a>
      <a class="store" href="https://play.google.com/store/apps/details?id=com.dbromberg.scented" rel="noopener">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
        <span><small>Get it on</small>Google Play</span>
      </a>
    </div>
    <div class="qr">
      <img src="/assets/get-qr.svg" alt="QR code for perfumediapp.com/get" width="150" height="150" />
      <div>On a computer? Scan with your phone's camera.</div>
    </div>
    <a class="home" href="/">perfumediapp.com</a>
  </main>
</body>
</html>
