<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Which Perfume Personality Are You? — Perfumedia</title>
  <meta name="description" content="A 60-second quiz that names your fragrance identity. 12 Perfume Personalities, built on real scent DNA. Which one are you?" />
  <meta name="theme-color" content="#FAF7F2" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <meta property="og:title" content="Which Perfume Personality Are You?" />
  <meta property="og:description" content="12 Perfume Personalities. One is yours. A 60-second quiz by Perfumedia." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://perfumediapp.com/quiz.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #FAF7F2;
      --surface: #FFFFFF;
      --surface-alt: #F5F1E9;
      --text: #1C1B1F;
      --text-2: #8A857D;
      --accent: #C9A227;
      --accent-deep: #A9861A;
      --accent-soft: #F8F2DF;
      --accent-muted: #EFE3BC;
      --hairline: #ECE7DD;
      --serif: "Fraunces", Georgia, serif;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    button { font-family: var(--sans); cursor: pointer; }

    .top {
      position: sticky; top: 0; z-index: 20;
      background: rgba(250,247,242,0.9);
      backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--hairline);
    }
    .top-inner {
      max-width: 720px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .brand span { font-family: var(--serif); font-weight: 600; letter-spacing: 0.22em; font-size: 15px; }
    .progress-wrap { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .progress-label { font-size: 12.5px; font-weight: 600; color: var(--text-2); letter-spacing: 0.04em; }
    .bar { width: 110px; height: 6px; background: var(--accent-muted); border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-deep)); border-radius: 99px; transition: width 0.4s var(--ease); }

    main { max-width: 720px; margin: 0 auto; padding: 40px 20px 90px; }

    /* ---------- Intro ---------- */
    .eyebrow { text-transform: uppercase; letter-spacing: 0.18em; font-size: 12px; font-weight: 600; color: var(--accent-deep); margin-bottom: 14px; text-align: center; }
    .intro h1 {
      font-family: var(--serif); font-weight: 500; font-size: clamp(34px, 7vw, 54px);
      line-height: 1.08; letter-spacing: -0.015em; text-align: center; text-wrap: balance;
    }
    .intro h1 em { font-style: italic; color: var(--accent-deep); }
    .intro .sub { text-align: center; color: var(--text-2); font-size: 17px; max-width: 46ch; margin: 18px auto 30px; }
    .grid12 {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 auto 34px; max-width: 480px;
    }
    .mini {
      border-radius: 14px; padding: 12px 4px 10px; text-align: center; color: #fff;
      font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    }
    .mini div { font-size: 22px; margin-bottom: 4px; }
    .cta-row { display: flex; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; border-radius: 999px; font-weight: 600; font-size: 16px;
      padding: 16px 34px; transition: transform 0.25s var(--ease), box-shadow 0.25s;
      text-decoration: none;
    }
    .btn-primary { background: var(--text); color: #fff; box-shadow: 0 10px 26px -12px rgba(28,27,31,0.45); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-gold { background: var(--accent); color: #fff; box-shadow: 0 10px 26px -10px rgba(169,134,26,0.55); }
    .btn-gold:hover { transform: translateY(-2px); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--hairline); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent-deep); }
    .intro-meta { text-align: center; margin-top: 16px; font-size: 13.5px; color: var(--text-2); }

    /* ---------- Quiz ---------- */
    .qcard { display: none; animation: rise 0.45s var(--ease); }
    .qcard.active { display: block; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .qnum { text-transform: uppercase; letter-spacing: 0.16em; font-size: 12px; font-weight: 600; color: var(--accent-deep); margin-bottom: 10px; }
    .qtitle { font-family: var(--serif); font-weight: 500; font-size: clamp(24px, 5vw, 34px); line-height: 1.15; margin-bottom: 6px; text-wrap: balance; }
    .qhint { color: var(--text-2); font-size: 15px; margin-bottom: 22px; }

    .opts { display: grid; gap: 12px; }
    .opts.cols2 { grid-template-columns: repeat(2, 1fr); }
    .opt {
      background: var(--surface); border: 1.5px solid var(--hairline); border-radius: 16px;
      padding: 16px 18px; text-align: left; font-size: 15.5px; font-weight: 500; color: var(--text);
      display: flex; align-items: center; gap: 12px;
      transition: border-color 0.2s, background 0.2s, transform 0.2s var(--ease);
    }
    .opt:hover { border-color: var(--accent); transform: translateY(-1px); }
    .opt.sel { border-color: var(--accent-deep); background: var(--accent-soft); }
    .opt .e { font-size: 22px; flex-shrink: 0; }
    .opt small { display: block; font-weight: 400; color: var(--text-2); font-size: 13px; line-height: 1.4; }

    .chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip {
      background: var(--surface); border: 1.5px solid var(--hairline); border-radius: 999px;
      padding: 10px 18px; font-size: 14.5px; font-weight: 500;
      transition: border-color 0.2s, background 0.2s;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.sel { border-color: var(--accent-deep); background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }

    .qnav { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; }
    .qnav .btn { padding: 13px 26px; font-size: 15px; }
    .back-link { background: none; border: 0; color: var(--text-2); font-size: 14.5px; font-weight: 500; }
    .back-link:hover { color: var(--text); }

    /* ---------- Result ---------- */
    .reveal { display: none; animation: rise 0.6s var(--ease); }
    .reveal.active { display: block; }
    .card {
      border-radius: 28px; padding: 44px 30px 38px; color: #fff; text-align: center;
      box-shadow: 0 34px 80px -30px rgba(28,27,31,0.5); position: relative; overflow: hidden;
    }
    .card::after {
      content: ""; position: absolute; top: -70px; left: 50%; transform: translateX(-50%);
      width: 340px; height: 200px; background: radial-gradient(closest-side, rgba(255,255,255,0.16), transparent);
    }
    .card .pe { font-size: 54px; }
    .card .rarity {
      display: inline-block; margin-top: 12px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em;
      background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
      padding: 6px 14px; border-radius: 999px;
    }
    .card h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(34px, 7vw, 46px); margin: 12px 0 6px; }
    .card .tag { font-family: var(--serif); font-style: italic; font-size: 18px; opacity: 0.92; }
    .traits { display: flex; justify-content: center; gap: 8px; margin: 20px 0 0; flex-wrap: wrap; }
    .trait { background: rgba(255,255,255,0.14); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
    .reading {
      background: var(--surface); border: 1px solid var(--hairline); border-radius: 20px;
      padding: 26px 26px; margin-top: 18px; font-size: 16px; color: var(--text);
      line-height: 1.75;
    }
    .runner { text-align: center; color: var(--text-2); font-size: 14.5px; margin-top: 14px; }
    .runner b { color: var(--text); }

    .share-row { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }

    /* ---------- Locked matches (the conversion block) ---------- */
    .locked {
      margin-top: 34px; background: var(--surface); border: 1px solid var(--hairline);
      border-radius: 24px; padding: 30px 24px; text-align: center; position: relative; overflow: hidden;
    }
    .locked h3 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin-bottom: 6px; }
    .locked .lsub { color: var(--text-2); font-size: 15px; max-width: 42ch; margin: 0 auto 22px; }
    .bottles { display: flex; justify-content: center; gap: 18px; margin-bottom: 8px; }
    .bottle {
      position: relative; width: 86px; height: 130px; border: 0; background: none; padding: 0;
    }
    .bottle svg { width: 100%; height: 100%; filter: blur(2.5px); opacity: 0.55; transition: opacity 0.2s; }
    .bottle:hover svg { opacity: 0.75; }
    .bottle .qm {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-family: var(--serif); font-size: 30px; color: var(--accent-deep); font-weight: 600;
    }
    .match-pill {
      position: absolute; top: -6px; right: -8px; background: var(--accent-soft); color: var(--accent-deep);
      border: 1px solid var(--accent-muted); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 8px;
    }
    .locked .fine { margin-top: 14px; font-size: 12.5px; color: var(--text-2); }

    .retake { text-align: center; margin-top: 26px; }

    footer { max-width: 720px; margin: 0 auto; padding: 0 20px 50px; text-align: center; font-size: 13px; color: var(--text-2); }
    footer a { color: var(--accent-deep); text-decoration: none; }

    @media (max-width: 560px) {
      .grid12 { grid-template-columns: repeat(3, 1fr); }
      .opts.cols2 { grid-template-columns: 1fr; }
      .bar { width: 70px; }
      .bottles { gap: 10px; }
      .bottle { width: 74px; height: 112px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">
        <svg width="24" height="24" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <path d="M50,18 L80,82 L20,82 Z" stroke="#C9A227" stroke-width="6" stroke-linejoin="round"/>
          <path d="M36.9,46 L63.1,46" stroke="#C9A227" stroke-width="6"/>
          <path d="M28.4,64 L71.6,64" stroke="#C9A227" stroke-width="6"/>

  <main>
    <!-- INTRO -->
    <section class="intro" id="intro">
      <p class="eyebrow">The Perfumedia Quiz · 60 seconds</p>
      <h1>Which perfume personality <em>are you?</em></h1>
      <p class="sub">Twelve identities, drawn from real scent DNA. Answer eight quick questions and we will name yours.</p>
      <div class="grid12" id="grid12" aria-hidden="true"></div>
      <div class="cta-row"><button class="btn btn-primary" id="startBtn">Find my personality</button></div>
      <p class="intro-meta">Free · No sign-up · About a minute</p>
    </section>

    <!-- QUIZ -->
    <section id="quiz" hidden></section>

    <!-- RESULT -->
    <section class="reveal" id="reveal"></section>
  </main>

  <footer>
    © <span id="year">2026</span> Perfumedia · <a href="index.html">perfumediapp.com</a> · <a href="privacy.html">Privacy</a>
  </footer>

  <script>
  (function () {
    "use strict";

    /* ============ The 12 Personalities (ported verbatim from the app) ============ */
    var PERSONALITIES = [
      { id:'sovereign', name:'The Sovereign', tagline:'You do not enter a room. You arrive in it.', emoji:'👑',
        families:{oud:1,leather:0.7,amber:0.5,smoky:0.3}, gradient:['#4A2E12','#20140A'], accent:'#B98029',
        traits:['Commanding','Magnetic','Unapologetic'],
        reading:'You wear scent like a crown. Where others reach for something easy, you reach for something that lingers in the doorway long after you have gone. Oud, leather, amber: these are not shy notes, and neither are you. People remember how you made them feel, and a little of how you smelled while doing it. You are not trying to be liked by everyone. You would rather be unforgettable to a few.',
        rarity:0.06 },
      { id:'alchemist', name:'The Alchemist', tagline:'You are drawn to what most people cannot name.', emoji:'⚗️',
        families:{smoky:1,boozy:0.9,spicy:0.7,oud:0.3}, gradient:['#2E1A3A','#160D1E'], accent:'#8E6BC0',
        traits:['Mysterious','Intense','Curious'],
        reading:'Smoke, spice, something poured over ice at midnight. You do not want a fragrance that explains itself in the first breath. You want one that unfolds, shifts, keeps a secret or two. People find you a little hard to read, and you like it that way. Your scent is the same: complex, a bit dangerous, impossible to file under a single word.',
        rarity:0.05 },
      { id:'old_soul', name:'The Old Soul', tagline:'You were born nostalgic for a time you never lived.', emoji:'📜',
        families:{tobacco:1,mossy:0.9,leather:0.6,woody:0.3}, gradient:['#3B3320','#1B1710'], accent:'#9A8B4F',
        traits:['Timeless','Grounded','Thoughtful'],
        reading:'Tobacco leaf, worn leather, a forest after rain. Your taste skips the trend cycle entirely and lands somewhere quieter and more permanent. You are the friend people call when they need to be talked down or thought through. Your scent has the same steadiness: warm, lived-in, the kind that feels like it has a history even on the first wear.',
        rarity:0.07 },
      { id:'romantic', name:'The Romantic', tagline:'You feel everything, and you wear it beautifully.', emoji:'🌹',
        families:{rose:1,floral:0.8,powdery:0.3}, gradient:['#7A2540','#3A1020'], accent:'#C25574',
        traits:['Tender','Nostalgic','Warm-hearted'],
        reading:'Roses, petals, a soft powder finish. You are ruled by the heart and you have made peace with that. You keep old letters, remember anniversaries, cry at films you have seen ten times. Your scent is an extension of that openness: lush, emotional, unafraid to be pretty in a world that pretends not to care about pretty. People feel safe around you, and they should.',
        rarity:0.1 },
      { id:'muse', name:'The Muse', tagline:'The quietest scent in the room, and the one they remember.', emoji:'🕊️',
        families:{powdery:1,musk:0.9,floral:0.4}, gradient:['#4A4658','#211F2A'], accent:'#9791B4',
        traits:['Refined','Understated','Intimate'],
        reading:'Soft musk, clean powder, a whisper of flower. You have never needed to be the loudest to be the most noticed. Your elegance is the quiet kind that makes people lean in rather than step back. Your scent works the same magic: it does not announce itself, it just makes everything around you feel a little more considered. Restraint, on you, reads as confidence.',
        rarity:0.08 },
      { id:'confection', name:'The Confection', tagline:'Warm, sweet, and completely impossible to resist.', emoji:'🍯',
        families:{gourmand:1,vanilla:0.9}, gradient:['#6B3E1E','#331C0E'], accent:'#D08A4A',
        traits:['Playful','Warm','Irresistible'],
        reading:'Vanilla, caramel, something you almost want to eat. You are the human equivalent of a warm kitchen: people gravitate to you and do not fully know why. There is a generosity to your taste, a refusal to take life too seriously. Your scent is a hug that walks in before you do. Comforting is not a lesser quality. Done right, it is the most magnetic one there is.',
        rarity:0.11 },
      { id:'enchanter', name:'The Enchanter', tagline:'You get under the skin, in the best possible way.', emoji:'🔮',
        families:{amber:1,vanilla:0.6,musk:0.6}, gradient:['#5A2E33','#2A1418'], accent:'#C56A78',
        traits:['Sensual','Magnetic','Intimate'],
        reading:'Amber, warm vanilla, a musk that smells like skin. Your scent lives close to the body, so it rewards the people who get close. You are the slow burn, the second glance, the number saved without a last name. You do not perform your allure, you simply carry it and let people notice on their own. And they do.',
        rarity:0.09 },
      { id:'sunchild', name:'The Sunchild', tagline:'You walk in and the lights come up.', emoji:'☀️',
        families:{citrus:1,aromatic:0.3,fruity:0.3}, gradient:['#B8791A','#6B4410'], accent:'#E0A02E',
        traits:['Radiant','Energetic','Warm'],
        reading:'Citrus, sunshine, a burst of something bright and alive. You are the person who makes the group chat better, the one who texts back, the one who somehow always knows a good spot. Your scent matches your wattage: clean, uplifting, the smell of a good day that is only getting better. Optimism looks effortless on you, but it is a choice you keep making.',
        rarity:0.1 },
      { id:'charmer', name:'The Charmer', tagline:'Effortlessly liked, and you know it.', emoji:'🍑',
        families:{fruity:1,floral:0.5}, gradient:['#A83E5A','#4E1B2A'], accent:'#E07A94',
        traits:['Flirtatious','Fun','Easygoing'],
        reading:'Ripe fruit, a wink of flower, everything a little juicy. You are the good-time friend with surprising depth, the one who makes strangers feel like old ones. There is a lightness to your taste that never tips into shallow. Your scent is flirtatious without trying, sweet without cloying, the olfactory equivalent of a great first impression that actually holds up.',
        rarity:0.09 },
      { id:'icon', name:'The Icon', tagline:'Timeless taste. You never chase, you set.', emoji:'🎩',
        families:{aromatic:1,woody:0.9}, gradient:['#28323C','#12181E'], accent:'#6E8CA0',
        traits:['Classic','Dependable','Polished'],
        reading:'Clean woods, fresh herbs, the smell of someone who has it together. You do not follow trends because you never needed to. Your taste is the reference point other people quietly copy. There is comfort in your consistency and quality in your restraint. Your scent is the well-cut jacket of fragrances: never loud, always right, the kind of choice that ages into a signature.',
        rarity:0.1 },
      { id:'wanderer', name:'The Wanderer', tagline:'Happiest with the window down and the map closed.', emoji:'🧭',
        families:{green:1,aquatic:0.9,aromatic:0.3}, gradient:['#1F4A44','#0E2320'], accent:'#3E9B8C',
        traits:['Free','Restless','Grounded'],
        reading:'Cut grass, sea air, something green and alive. You need horizon. Rooms feel small to you and plans feel optional. Your scent is the outdoors bottled: fresh, open, a little untamed. You are the friend who suggests the detour and is always right about it. Freedom is not a phase for you. It is the whole design.',
        rarity:0.09 },
      { id:'maverick', name:'The Maverick', tagline:'You liked it before it had a name.', emoji:'⚡',
        families:{}, gradient:['#2A2E33','#131518'], accent:'#7C8A99',
        traits:['Bold','Contrarian','Original'],
        reading:'You do not want what everyone has. You want the weird one, the one the sales associate did not expect you to reach for, the note nobody else can place on you. Your taste runs ahead of the crowd and you are comfortable out there alone. Your scent is a statement of independence: unconventional, a little provocative, unmistakably yours. Trends catch up to you, never the other way around.',
        rarity:0.04 },
    ];
    var BY_ID = {};
    PERSONALITIES.forEach(function (p) { BY_ID[p.id] = p; });

    /* ============ Questions ============ */
    var FAMS = [
      ['oud','🪵 Oud'], ['leather','🧥 Leather'], ['amber','🟠 Amber'], ['vanilla','🍦 Vanilla'],
      ['gourmand','🍮 Sweet treats'], ['rose','🌹 Rose'], ['floral','💐 Florals'], ['powdery','🌫️ Powdery'],
      ['musk','🤍 Musk'], ['citrus','🍋 Citrus'], ['fruity','🍑 Fruits'], ['green','🌿 Green'],
      ['aquatic','🌊 Sea air'], ['aromatic','🌱 Herbs'], ['woody','🌲 Woods'], ['spicy','🌶️ Spice'],
      ['smoky','🔥 Smoke'], ['boozy','🥃 Boozy'], ['tobacco','🍂 Tobacco'], ['mossy','🍃 Moss'],
    ];

    var QUESTIONS = [
      { type:'chips', title:'Which notes pull you in?', hint:'Pick up to 5. Go with instinct.',
        max:5, min:1, items:FAMS,
        apply:function (state, sel) { sel.forEach(function (f) { state.fp[f] = (state.fp[f]||0) + 1; }); } },

      { type:'single', title:'Your fragrance walks into the room…', hint:'How loud do you like it?',
        opts:[
          ['📣','Before I do', 'Everyone knows it is me', {intensity:0.9}],
          ['🚶','With me', 'Noticeable, never shouting', {intensity:0.65}],
          ['🤝','Only up close', 'A reward for leaning in', {intensity:0.3}],
          ['🫧','Barely there', 'My skin, but better', {intensity:0.12}],
        ] },

      { type:'single', title:'Dessert menu arrives. You…', hint:'Your sweet tooth, honestly.',
        opts:[
          ['🍰','Order two', 'Sweet is the point', {sweetness:0.9}],
          ['🍪','Usually say yes', 'Balanced, but tempted', {sweetness:0.6}],
          ['☕','Espresso instead', 'Sweet in small doses', {sweetness:0.3}],
          ['🧀','Cheese board', 'Keep it dry', {sweetness:0.08}],
        ] },

      { type:'single', title:'At the counter, you reach for…', hint:'Be honest.',
        opts:[
          ['🏆','The icon', 'The one everyone loves, loved for a reason', {adventurous:0.08}],
          ['🕰️','A classic, done well', 'Proven, polished, mine', {adventurous:0.3}],
          ['🎭','Something a little different', 'Familiar, with a twist', {adventurous:0.6}],
          ['👽','The weirdest bottle there', 'If they stock it, I sniff it', {adventurous:0.95}],
        ] },

      { type:'single', title:'Pick your season', hint:'The one that feels like you.',
        opts:[
          ['🌸','Spring', 'Bloom and rain', {fams:{green:0.5,floral:0.5,rose:0.4}}],
          ['🏖️','Summer', 'Heat and salt', {fams:{citrus:0.5,aquatic:0.5,fruity:0.4}}],
          ['🍁','Autumn', 'Amber light', {fams:{tobacco:0.5,woody:0.5,spicy:0.4}}],
          ['❄️','Winter', 'Fireside dark', {fams:{amber:0.5,oud:0.4,vanilla:0.5}}],
        ] },

      { type:'single', title:'Ideal Friday night?', hint:'No wrong answers.',
        opts:[
          ['🍸','Dim bar, good company', 'Low light, strong pours', {fams:{boozy:0.5,smoky:0.5}, intensity:0.12}],
          ['🍽️','Dinner party', 'Long table, better stories', {fams:{aromatic:0.5,woody:0.4}}],
          ['🛋️','In, and glad about it', 'Candles and something baking', {fams:{vanilla:0.5,gourmand:0.5,powdery:0.3}}],
          ['🏕️','Somewhere outside', 'Fire, stars, cold air', {fams:{green:0.5,aquatic:0.4,mossy:0.3}}],
        ] },

      { type:'single', title:'Which texture is most you?', hint:'Trust the first answer.',
        opts:[
          ['🥃','Velvet and low light', '', {fams:{amber:0.5,musk:0.4,oud:0.3}}],
          ['🧳','A worn leather jacket', '', {fams:{leather:0.6,tobacco:0.4}}],
          ['🛏️','Fresh pressed linen', '', {fams:{musk:0.4,powdery:0.4,citrus:0.3}}],
          ['📚','An old library', '', {fams:{mossy:0.5,woody:0.4,tobacco:0.3}}],
        ] },

      { type:'single', title:'What should people remember?', hint:'Your exit, in one word.',
        opts:[
          ['🌪️','That I was unforgettable', '', {fams:{oud:0.4,amber:0.3}, intensity:0.85}],
          ['🎩','That I had it together', '', {fams:{aromatic:0.5,woody:0.4}}],
          ['🌙','A feeling they cannot place', '', {fams:{musk:0.4,powdery:0.3,vanilla:0.3}, intensity:0.25}],
          ['🎉','That it was fun', '', {fams:{fruity:0.5,citrus:0.4}}],
        ] },
    ];

    /* ============ Scoring (ported from engine/personality.ts) ============ */
    function derivePersonality(state) {
      var fp = state.fp;
      var adventurous = state.adventurous || 0;
      var sweetness = state.sweetness;
      var intensity = avg(state.intensitySamples);

      var familyScore = PERSONALITIES.map(function (p) {
        var s = 0;
        Object.keys(p.families).forEach(function (fam) { s += (fp[fam]||0) * p.families[fam]; });
        return { p:p, s:s };
      });
      var familyMax = Math.max.apply(null, [0.0001].concat(
        familyScore.filter(function (r) { return r.p.id !== 'maverick'; }).map(function (r) { return r.s; })
      ));
      var scored = familyScore.map(function (r) {
        var score = r.s;
        switch (r.p.id) {
          case 'maverick': score = adventurous * familyMax * 1.3; break;
          case 'confection': if (sweetness !== undefined) score *= 1 + Math.max(0, sweetness - 0.5) * 1.2; break;
          case 'sovereign': if (intensity !== undefined) score *= 1 + Math.max(0, intensity - 0.5) * 0.8; break;
          case 'alchemist': if (intensity !== undefined) score *= 1 + Math.max(0, intensity - 0.5) * 0.5; break;
          case 'muse': if (intensity !== undefined) score *= 1 + Math.max(0, 0.5 - intensity) * 0.9; break;
          case 'enchanter': if (intensity !== undefined) score *= 1 + Math.max(0, 0.6 - intensity) * 0.5; break;
        }
        return { p:r.p, score:score };
      });
      scored.sort(function (a,b) { return b.score - a.score; });
      return { winner: scored[0].p, runnerUp: (scored[1]||scored[0]).p };
    }
    function avg(xs) { if (!xs || !xs.length) return undefined; return xs.reduce(function(a,b){return a+b;},0)/xs.length; }

    /* ============ State & flow ============ */
    var doc = document;
    var state = { fp:{}, intensitySamples:[], sweetness:undefined, adventurous:0 };
    var idx = -1;
    var answers = [];

    var intro = doc.getElementById('intro');
    var quiz = doc.getElementById('quiz');
    var revealEl = doc.getElementById('reveal');
    var progressWrap = doc.getElementById('progressWrap');
    var progressBar = doc.getElementById('progressBar');
    var progressLabel = doc.getElementById('progressLabel');

    // Intro grid of the 12
    var g = doc.getElementById('grid12');
    PERSONALITIES.forEach(function (p) {
      var d = doc.createElement('div');
      d.className = 'mini';
      d.style.background = 'linear-gradient(160deg,' + p.gradient[0] + ',' + p.gradient[1] + ')';
      d.innerHTML = '<div>' + p.emoji + '</div>' + p.name.replace('The ','');
      g.appendChild(d);
    });

    doc.getElementById('year').textContent = String(new Date().getFullYear());

    doc.getElementById('startBtn').addEventListener('click', function () {
      intro.style.display = 'none';
      quiz.hidden = false;
      progressWrap.hidden = false;
      idx = 0; renderQ();
      window.scrollTo({ top: 0 });
    });

    function renderQ() {
      progressLabel.textContent = (idx+1) + ' / ' + QUESTIONS.length;
      progressBar.style.width = ((idx) / QUESTIONS.length * 100) + '%';
      var q = QUESTIONS[idx];
      var sel = answers[idx] || (q.type === 'chips' ? [] : null);
      var html = '<div class="qcard active"><p class="qnum">Question ' + (idx+1) + '</p>'
        + '<h2 class="qtitle">' + q.title + '</h2><p class="qhint">' + q.hint + '</p>';

      if (q.type === 'chips') {
        html += '<div class="chips">';
        q.items.forEach(function (it, i) {
          var on = sel.indexOf(it[0]) >= 0;
          html += '<button class="chip' + (on?' sel':'') + '" data-i="' + i + '">' + it[1] + '</button>';
        });
        html += '</div>';
      } else {
        html += '<div class="opts">';
        q.opts.forEach(function (o, i) {
          var on = sel === i;
          html += '<button class="opt' + (on?' sel':'') + '" data-i="' + i + '"><span class="e">' + o[0] + '</span>'
            + '<span>' + o[1] + (o[2] ? '<small>' + o[2] + '</small>' : '') + '</span></button>';
        });
        html += '</div>';
      }

      html += '<div class="qnav">'
        + (idx > 0 ? '<button class="back-link" id="backBtn">← Back</button>' : '<span></span>')
        + '<button class="btn btn-primary" id="nextBtn"' + (q.type==='chips' && (!sel || sel.length < q.min) ? ' disabled style="opacity:0.45"' : (sel===null ? ' disabled style="opacity:0.45"' : '')) + '>'
        + (idx === QUESTIONS.length-1 ? 'Reveal my personality' : 'Next') + '</button></div></div>';

      quiz.innerHTML = html;

      if (q.type === 'chips') {
        Array.prototype.forEach.call(quiz.querySelectorAll('.chip'), function (b) {
          b.addEventListener('click', function () {
            var fam = q.items[+b.dataset.i][0];
            var cur = answers[idx] || (answers[idx] = []);
            var at = cur.indexOf(fam);
            if (at >= 0) { cur.splice(at,1); b.classList.remove('sel'); }
            else if (cur.length < q.max) { cur.push(fam); b.classList.add('sel'); }
            var nb = doc.getElementById('nextBtn');
            var ok = cur.length >= q.min;
            nb.disabled = !ok; nb.style.opacity = ok ? '1' : '0.45';
          });
        });
      } else {
        Array.prototype.forEach.call(quiz.querySelectorAll('.opt'), function (b) {
          b.addEventListener('click', function () {
            answers[idx] = +b.dataset.i;
            Array.prototype.forEach.call(quiz.querySelectorAll('.opt'), function (x) { x.classList.remove('sel'); });
            b.classList.add('sel');
            var nb = doc.getElementById('nextBtn');
            nb.disabled = false; nb.style.opacity = '1';
          });
        });
      }

      var back = doc.getElementById('backBtn');
      if (back) back.addEventListener('click', function () { idx--; renderQ(); });

      doc.getElementById('nextBtn').addEventListener('click', function () {
        if (idx === QUESTIONS.length - 1) finish(); else { idx++; renderQ(); }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    function applyAll() {
      state = { fp:{}, intensitySamples:[], sweetness:undefined, adventurous:0 };
      QUESTIONS.forEach(function (q, i) {
        var a = answers[i];
        if (a === undefined || a === null) return;
        if (q.type === 'chips') { q.apply(state, a); return; }
        var eff = q.opts[a][3] || {};
        if (eff.fams) Object.keys(eff.fams).forEach(function (f) { state.fp[f] = (state.fp[f]||0) + eff.fams[f]; });
        if (eff.intensity !== undefined) state.intensitySamples.push(eff.intensity);
        if (eff.sweetness !== undefined) state.sweetness = eff.sweetness;
        if (eff.adventurous !== undefined) state.adventurous = eff.adventurous;
      });
    }

    function bottleSvg(accent) {
      return '<svg viewBox="0 0 90 140" fill="none">'
        + '<rect x="36" y="4" width="18" height="14" rx="3" fill="' + accent + '"/>'
        + '<rect x="30" y="18" width="30" height="10" rx="3" fill="' + accent + '" opacity="0.7"/>'
        + '<path d="M22 40 C22 32 30 28 45 28 C60 28 68 32 68 40 L68 118 C68 128 60 134 45 134 C30 134 22 128 22 118 Z" fill="' + accent + '" opacity="0.45"/>'
        + '<rect x="30" y="62" width="30" height="34" rx="4" fill="#fff" opacity="0.55"/>'
        + '</svg>';
    }

    function renderResult(p, runnerUp, shared) {
      progressWrap.hidden = true;
      quiz.hidden = true;
      intro.style.display = 'none';

      var shareText = shared
        ? ''
        : '';
      var matches = ['94%','91%','88%'];
      var html = ''
        + '<div class="card" style="background:linear-gradient(165deg,' + p.gradient[0] + ',' + p.gradient[1] + ')">'
        +   '<div class="pe">' + p.emoji + '</div>'
        +   '<h2>' + p.name + '</h2>'
        +   '<p class="tag">' + p.tagline + '</p>'
        +   '<div class="traits">' + p.traits.map(function (t) { return '<span class="trait">' + t + '</span>'; }).join('') + '</div>'
        +   '<span class="rarity">Only ' + Math.round(p.rarity*100) + '% of people land here</span>'
        + '</div>'
        + '<div class="reading">' + p.reading + '</div>'
        + (runnerUp ? '<p class="runner">With a streak of <b>' + runnerUp.name + '</b> ' + runnerUp.emoji + '</p>' : '')
        + '<div class="share-row">'
        +   '<button class="btn btn-gold" id="shareBtn">Share my result</button>'
        +   (shared ? '<a class="btn btn-primary" href="quiz.html">Find yours →</a>' : '')
        + '</div>'
        + '<div class="locked">'
        +   '<h3>' + p.name.replace('The ','The ') + '’s signature scents</h3>'
        +   '<p class="lsub">We matched ' + p.name + ' against 50,000 fragrances. Your top matches are waiting in the app.</p>'
        +   '<div class="bottles">'
        +     [0,1,2].map(function (i) {
                return '<button class="bottle" data-lock="1" aria-label="Locked match">'
                  + bottleSvg(p.accent) + '<span class="qm">?</span>'
                  + '<span class="match-pill">' + matches[i] + '</span></button>';
              }).join('')
        +   '</div>'
        +   '<a class="btn btn-primary" href="index.html#get" id="unlockBtn">Reveal my matches in the app</a>'
        +   '<p class="fine">Free to download · Your quiz result carries over</p>'
        + '</div>'
        + (shared ? '' : '<div class="retake"><button class="back-link" id="retakeBtn">Retake the quiz</button></div>');

      revealEl.innerHTML = html;
      revealEl.classList.add('active');

      var url = 'https://perfumediapp.com/quiz.html?p=' + p.id;
      var text = 'I got ' + p.name + ' ' + p.emoji + ' on the Perfumedia perfume personality quiz. Which one are you?';
      doc.getElementById('shareBtn').addEventListener('click', function () {
        if (navigator.share) {
          navigator.share({ title: p.name, text: text, url: url }).catch(function () {});
        } else {
          navigator.clipboard.writeText(text + ' ' + url).then(function () {
            doc.getElementById('shareBtn').textContent = 'Link copied ✓';
          }).catch(function () {});
        }
      });
      Array.prototype.forEach.call(revealEl.querySelectorAll('[data-lock]'), function (b) {
        b.addEventListener('click', function () {
          doc.getElementById('unlockBtn').scrollIntoView({ behavior:'smooth', block:'center' });
          doc.getElementById('unlockBtn').style.transform = 'scale(1.04)';
          setTimeout(function () { doc.getElementById('unlockBtn').style.transform = ''; }, 250);
        });
      });
      var retake = doc.getElementById('retakeBtn');
      if (retake) retake.addEventListener('click', function () {
        answers = []; idx = 0;
        revealEl.classList.remove('active'); revealEl.innerHTML = '';
        quiz.hidden = false; progressWrap.hidden = false;
        renderQ();
        window.scrollTo({ top: 0 });
      });
    }

    function finish() {
      applyAll();
      var r = derivePersonality(state);
      try { history.replaceState(null, '', 'quiz.html?p=' + r.winner.id); } catch (e) {}
      renderResult(r.winner, r.runnerUp, false);
      window.scrollTo({ top: 0 });
    }

    /* Shared link: ?p=<id> renders that result with a "find yours" CTA */
    var params = new URLSearchParams(location.search);
    var pre = params.get('p');
    if (pre && BY_ID[pre]) {
      renderResult(BY_ID[pre], null, true);
    }
  })();
  </script>
