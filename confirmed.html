<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Email confirmed — Perfumedia</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #FAF7F2; color: #181510;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 420px; }
    .mark { font-size: 56px; line-height: 1; }
    h1 { font-size: 28px; margin: 18px 0 8px; letter-spacing: .3px; }
    p { color: #6b6357; font-size: 16px; line-height: 1.5; margin: 0; }
    .brand { margin-top: 28px; font-size: 12px; letter-spacing: 2.5px; color: #A6791C; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">✅</div>
    <h1>Your email is confirmed</h1>
    <p>You're all set. Head back to the Perfumedia app and sign in — your account is ready.</p>
    <div class="brand">Perfumedia</div>
  </div>
</body>
</html>
